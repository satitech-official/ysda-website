name: Deploy YSDA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES_BASE_PATH: "/"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate football-only source media
        run: |
          node <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const path = require('path');

          const repo = process.cwd();
          const photosDir = path.join(repo, 'public', 'ysda-football', 'photos');
          const sourceText = [
            fs.readFileSync(path.join(repo, 'lib', 'content.ts'), 'utf8'),
            fs.readFileSync(path.join(repo, 'app', 'page.tsx'), 'utf8')
          ].join('\n');
          const legacyName = 'ys' + 'dfi';
          const disallowedSports = ['basketball', 'volleyball', 'cricket', 'skating', 'karate', 'kho-kho'];
          const violations = [];

          if (sourceText.toLowerCase().includes(legacyName)) violations.push('Legacy federation name remains in runtime source.');
          for (const sport of disallowedSports) {
            if (sourceText.toLowerCase().includes(sport)) violations.push(`Non-football sport remains in runtime source: ${sport}`);
          }
          if (!sourceText.includes('leadership: "/ysda-president-rafik-raja.jpg"')) violations.push('President photo mapping changed.');
          if (!sourceText.includes('secretaryPortrait: "/ysda-secretary-ramiz-raja.png"')) violations.push('Secretary photo mapping changed.');

          const photos = fs.readdirSync(photosDir).filter((name) => /\.jpg$/i.test(name)).sort();
          const references = [...sourceText.matchAll(/footballPhoto\("([^"]+)"\)/g)].map((match) => `${match[1]}.jpg`);
          const uniqueReferences = new Set(references);
          if (photos.length !== 31) violations.push(`Expected 31 curated football photos; found ${photos.length}.`);
          if (references.length !== 31) violations.push(`Expected 31 football photo references; found ${references.length}.`);
          if (uniqueReferences.size !== references.length) violations.push('A football photo is referenced more than once in runtime source.');
          for (const name of photos) {
            if (!uniqueReferences.has(name)) violations.push(`Curated football photo is unused: ${name}`);
          }
          for (const name of uniqueReferences) {
            if (!photos.includes(name)) violations.push(`Referenced football photo is missing: ${name}`);
          }
          const hashes = new Map();
          for (const name of photos) {
            const file = path.join(photosDir, name);
            const bytes = fs.readFileSync(file);
            if (bytes.length < 50_000) violations.push(`Photo is unexpectedly small: ${name}`);
            const hash = crypto.createHash('sha256').update(bytes).digest('hex');
            if (hashes.has(hash)) violations.push(`Exact duplicate photos: ${hashes.get(hash)} and ${name}`);
            hashes.set(hash, name);
          }

          const publicEntries = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const current = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(current);
              else publicEntries.push(path.relative(path.join(repo, 'public'), current));
            }
          }
          walk(path.join(repo, 'public'));
          if (publicEntries.some((name) => name.toLowerCase().includes(legacyName))) violations.push('Legacy federation-named public asset remains.');

          if (violations.length) throw new Error(violations.join('\n'));
          console.log('Curated football-only source media passed validation.');
          NODE

      - name: Build static website
        run: npm run build

      - name: Validate production artifact
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const outDir = path.resolve('out');
          const legacyName = 'ys' + 'dfi';
          const disallowedSports = ['basketball', 'volleyball', 'cricket', 'skating', 'karate', 'kho-kho'];
          const textExtensions = new Set(['.html', '.js', '.css', '.json', '.txt', '.xml', '.webmanifest']);
          const files = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const current = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(current);
              else files.push(current);
            }
          }
          walk(outDir);

          const text = files
            .filter((file) => textExtensions.has(path.extname(file).toLowerCase()))
            .map((file) => fs.readFileSync(file, 'utf8'))
            .join('\n')
            .toLowerCase();
          const violations = [];
          if (text.includes(legacyName)) violations.push('Legacy federation name remains in live output.');
          for (const sport of disallowedSports) {
            if (text.includes(sport)) violations.push(`Non-football sport remains in live output: ${sport}`);
          }
          if (files.some((file) => path.relative(outDir, file).toLowerCase().includes(legacyName))) violations.push('Legacy federation-named file remains in live output.');
          for (const rel of [
            'ysda-president-rafik-raja.jpg',
            'ysda-secretary-ramiz-raja.png',
            'ysda-hero-football.mp4',
            'ysda-football/photos/team-blue-white.jpg',
            'ysda-football/photos/girls-free-kick.jpg',
            'ysda-football/photos/football-game-action.jpg'
          ]) {
            if (!fs.existsSync(path.join(outDir, rel))) violations.push(`Missing production asset: ${rel}`);
          }
          if (violations.length) throw new Error(violations.join('\n'));
          console.log('Football-only production artifact passed validation.');
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
