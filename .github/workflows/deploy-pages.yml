name: Deploy YSDA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES_BASE_PATH: "/"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare YSDA-only football source and verified images
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pagePath = 'app/page.tsx';
          let page = fs.readFileSync(pagePath, 'utf8');
          page = page.replace(/YSDFI/gi, 'YSDA');
          fs.writeFileSync(pagePath, page, 'utf8');

          const contentPath = 'lib/content.ts';
          let content = fs.readFileSync(contentPath, 'utf8');

          const oldPhotoHelper = `const footballPhoto = (number: 1 | 2) =>\n  \`/ysda-football/football-\${String(number).padStart(2, "0")}.jpg\`;`;
          const newPhotoHelper = `const footballPhotos = {\n  1: "https://images.pexels.com/photos/30585018/pexels-photo-30585018.jpeg?cs=srgb&dl=pexels-franco-monsalvo-252430633-30585018.jpg&fm=jpg",\n  2: "https://images.pexels.com/photos/30585023/pexels-photo-30585023.jpeg?cs=srgb&dl=pexels-franco-monsalvo-252430633-30585023.jpg&fm=jpg",\n  3: "https://images.pexels.com/photos/30612718/pexels-photo-30612718.jpeg?cs=srgb&dl=pexels-franco-monsalvo-252430633-30612718.jpg&fm=jpg",\n  4: "https://images.pexels.com/photos/15153169/pexels-photo-15153169.jpeg?cs=srgb&dl=pexels-hardy-pictures-423932717-15153169.jpg&fm=jpg",\n  5: "https://images.pexels.com/photos/15789902/pexels-photo-15789902.jpeg?cs=srgb&dl=pexels-laura-rincon-318039951-15789902.jpg&fm=jpg",\n  6: "https://images.pexels.com/photos/9501976/pexels-photo-9501976.jpeg?cs=srgb&dl=pexels-anastasia-shuraeva-9501976.jpg&fm=jpg"\n} as const;\n\nconst footballPhoto = (number: keyof typeof footballPhotos) => footballPhotos[number];`;

          if (content.includes(oldPhotoHelper)) {
            content = content.replace(oldPhotoHelper, newPhotoHelper);
          } else if (!content.includes('const footballPhotos = {')) {
            throw new Error('Could not replace football photo helper');
          }

          const mediaReplacements = [
            ['heroDevelopment: footballPhoto(1)', 'heroDevelopment: footballPhoto(3)'],
            ['heroSquad: footballPhoto(2)', 'heroSquad: footballPhoto(4)'],
            ['heroMatch: footballPhoto(1)', 'heroMatch: footballPhoto(4)'],
            ['heroTraining: footballPhoto(2)', 'heroTraining: footballPhoto(3)'],
            ['footballWarmup: footballPhoto(1)', 'footballWarmup: footballPhoto(6)'],
            ['footballTeam: footballPhoto(2)', 'footballTeam: footballPhoto(1)'],
            ['footballCoach: footballPhoto(1)', 'footballCoach: footballPhoto(2)'],
            ['fitness: footballPhoto(2)', 'fitness: footballPhoto(3)'],
            ['teamTraining: footballPhoto(1)', 'teamTraining: footballPhoto(6)'],
            ['trophy: footballPhoto(2)', 'trophy: footballPhoto(4)'],
            ['officials: footballPhoto(1)', 'officials: footballPhoto(2)'],
            ['certificates: footballPhoto(2)', 'certificates: footballPhoto(5)'],
            ['awards: footballPhoto(1)', 'awards: footballPhoto(4)'],
            ['girlsTeam: footballPhoto(2)', 'girlsTeam: footballPhoto(6)'],
            ['referee: footballPhoto(1)', 'referee: footballPhoto(5)'],
            ['schoolProgram: footballPhoto(2)', 'schoolProgram: footballPhoto(6)'],
            ['trials: footballPhoto(1)', 'trials: footballPhoto(3)'],
            ['community: footballPhoto(2)', 'community: footballPhoto(1)']
          ];
          for (const [from, to] of mediaReplacements) content = content.replace(from, to);

          content = content.replace(
            'title, category, image, eventName, date: "2026", location: index % 2 === 0 ? "Mhow, Indore" : "YSDA Football Academy", caption\n}));',
            'title, category, image, eventName, date: "2026", location: index % 2 === 0 ? "Mhow, Indore" : "YSDA Football Academy", caption, video: undefined as string | undefined\n}));'
          );

          if (/YSDFI/i.test(content) || /YSDFI/i.test(page)) throw new Error('Legacy federation branding remains in source');
          if (/\/ysda-football\/football-0[12]\.jpg/.test(content)) throw new Error('Broken local football assets still referenced in source');
          if (!content.includes('images.pexels.com/photos/30585018')) throw new Error('Verified football images were not injected');
          fs.writeFileSync(contentPath, content, 'utf8');
          NODE

      - name: Build static website
        run: npm run build

      - name: Normalize custom-domain paths and validate YSDA-only output
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const outDir = path.resolve('out');
          const legacyPrefix = '/ysda-website';
          const textExtensions = new Set(['.html', '.js', '.css', '.json', '.txt', '.map', '.xml', '.webmanifest']);

          function walk(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const fullPath = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(fullPath) : [fullPath];
            });
          }

          let changed = 0;
          for (const file of walk(outDir)) {
            if (!textExtensions.has(path.extname(file).toLowerCase())) continue;
            const original = fs.readFileSync(file, 'utf8');
            const updated = original.split(legacyPrefix).join('').replace(/YSDFI/gi, 'YSDA');
            if (updated !== original) {
              fs.writeFileSync(file, updated, 'utf8');
              changed += 1;
            }
          }

          const violations = [];
          let verifiedImageRefs = 0;
          for (const file of walk(outDir)) {
            if (!textExtensions.has(path.extname(file).toLowerCase())) continue;
            const text = fs.readFileSync(file, 'utf8');
            if (text.includes(legacyPrefix)) violations.push(`${file}: legacy base path`);
            if (/YSDFI/i.test(text)) violations.push(`${file}: legacy federation branding`);
            if (/\b(basketball|volleyball|cricket|skating|karate|kho-kho)\b/i.test(text)) violations.push(`${file}: non-football sport content`);
            if (/\/ysda-football\/football-0[12]\.jpg/.test(text)) violations.push(`${file}: broken local football image reference`);
            if (text.includes('images.pexels.com/photos/30585018') || text.includes('images.pexels.com/photos/30585023')) verifiedImageRefs += 1;
          }
          if (!verifiedImageRefs) violations.push('No verified football image references found in generated output');
          if (violations.length) throw new Error(`YSDA-only/image validation failed:\n${violations.join('\n')}`);
          console.log(`Normalized and validated ${changed} generated file(s); working football photos detected.`);
          NODE

      - name: Ensure hero stats render correctly on mobile
        run: |
          node <<'NODE'
          const fs = require('fs');
          const indexPath = require('path').resolve('out/index.html');
          let html = fs.readFileSync(indexPath, 'utf8');
          const script = `<script id="ysda-hero-stats-mobile-fix">(function(){var expected={"Players Connected":"5000+","Football Events":"50+","Clubs and Academies":"70+","Coaches and Officials":"150+"};function fix(){var hero=document.getElementById("home");if(!hero)return;hero.querySelectorAll(".glass").forEach(function(card){var p=card.querySelector("p");var span=card.querySelector("span");if(!p||!span)return;var value=expected[p.textContent.trim()];if(value)span.textContent=value;});}[0,250,750,1500,3000].forEach(function(ms){setTimeout(fix,ms)});document.addEventListener("visibilitychange",function(){if(!document.hidden)fix()});})();</script>`;
          if (!html.includes('ysda-hero-stats-mobile-fix')) {
            html = html.replace('</body>', `${script}</body>`);
            fs.writeFileSync(indexPath, html, 'utf8');
          }
          if (!fs.readFileSync(indexPath, 'utf8').includes('ysda-hero-stats-mobile-fix')) throw new Error('Hero stats mobile fix missing');
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
