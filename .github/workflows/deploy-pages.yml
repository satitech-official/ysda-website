name: Deploy YSDA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES_BASE_PATH: "/"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare YSDA-only football source
        run: |
          node <<'NODE'
          const fs = require('fs');

          const pagePath = 'app/page.tsx';
          let page = fs.readFileSync(pagePath, 'utf8');
          const pageReplacements = [
            ['Established {academyInfo.established} - Associated with YSDFI', 'Established {academyInfo.established} - Football Development Academy'],
            ['and associated with the Youth\n            Sports Development Federation of India - YSDFI.', 'and fully focused on professional football development.'],
            ['Associated Organisation', 'Academy'],
            ['associated with {academyInfo.organisation}', 'focused on professional football development']
          ];
          for (const [from, to] of pageReplacements) page = page.split(from).join(to);
          page = page.replace(/YSDFI/gi, 'YSDA');
          fs.writeFileSync(pagePath, page, 'utf8');

          const contentPath = 'lib/content.ts';
          let content = fs.readFileSync(contentPath, 'utf8');
          content = content.replace(
            'title, category, image, eventName, date: "2026", location: index % 2 === 0 ? "Mhow, Indore" : "YSDA Football Academy", caption\n}));',
            'title, category, image, eventName, date: "2026", location: index % 2 === 0 ? "Mhow, Indore" : "YSDA Football Academy", caption, video: undefined as string | undefined\n}));'
          );
          if (/YSDFI/i.test(content)) throw new Error('Legacy federation branding remains in lib/content.ts');
          fs.writeFileSync(contentPath, content, 'utf8');
          NODE

      - name: Persist cleaned page source
        run: |
          if ! git diff --quiet -- app/page.tsx; then
            git config user.name "SatiTech"
            git config user.email "www.satitechinfo@gmail.com"
            git add app/page.tsx
            git commit -m "Remove final legacy federation references from page source [skip ci]"
            git push origin HEAD:main
          else
            echo "Page source already clean."
          fi

      - name: Build static website
        run: npm run build

      - name: Normalize custom-domain paths and validate YSDA-only output
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const outDir = path.resolve('out');
          const legacyPrefix = '/ysda-website';
          const textExtensions = new Set(['.html', '.js', '.css', '.json', '.txt', '.map', '.xml', '.webmanifest']);

          function walk(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const fullPath = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(fullPath) : [fullPath];
            });
          }

          const replacements = [
            ['Established 2021 - Associated with YSDFI', 'Established 2021 - Football Development Academy'],
            ['associated with the Youth Sports Development Federation of India - YSDFI', 'focused exclusively on football development'],
            ['Associated with YSDFI', 'YSDA Football Academy'],
            ['Youth Sports Development Federation of India - YSDFI', 'YSDA Football Academy'],
            ['Youth Sports Development Federation of India', 'Youth Sports Development Academy'],
            ['YSDFI', 'YSDA']
          ];

          let changed = 0;
          for (const file of walk(outDir)) {
            if (!textExtensions.has(path.extname(file).toLowerCase())) continue;
            const original = fs.readFileSync(file, 'utf8');
            let updated = original.split(legacyPrefix).join('');
            for (const [from, to] of replacements) updated = updated.split(from).join(to);
            if (updated !== original) {
              fs.writeFileSync(file, updated, 'utf8');
              changed += 1;
            }
          }

          const violations = [];
          for (const file of walk(outDir)) {
            if (!textExtensions.has(path.extname(file).toLowerCase())) continue;
            const text = fs.readFileSync(file, 'utf8');
            if (text.includes(legacyPrefix)) violations.push(`${file}: legacy base path`);
            if (/YSDFI/i.test(text)) violations.push(`${file}: legacy federation branding`);
            if (/\b(basketball|volleyball|cricket|skating|karate|kho-kho)\b/i.test(text)) violations.push(`${file}: non-football sport content`);
          }

          if (violations.length) throw new Error(`YSDA-only validation failed:\n${violations.join('\n')}`);
          console.log(`Normalized and validated ${changed} generated file(s).`);
          NODE

      - name: Ensure hero stats render correctly on mobile
        run: |
          node <<'NODE'
          const fs = require('fs');
          const indexPath = require('path').resolve('out/index.html');
          let html = fs.readFileSync(indexPath, 'utf8');
          const script = `<script id="ysda-hero-stats-mobile-fix">(function(){var expected={"Players Connected":"5000+","Football Events":"50+","Clubs and Academies":"70+","Coaches and Officials":"150+"};function fix(){var hero=document.getElementById("home");if(!hero)return;hero.querySelectorAll(".glass").forEach(function(card){var p=card.querySelector("p");var span=card.querySelector("span");if(!p||!span)return;var value=expected[p.textContent.trim()];if(value)span.textContent=value;});}[0,250,750,1500,3000].forEach(function(ms){setTimeout(fix,ms)});document.addEventListener("visibilitychange",function(){if(!document.hidden)fix()});})();</script>`;
          if (!html.includes('ysda-hero-stats-mobile-fix')) {
            html = html.replace('</body>', `${script}</body>`);
            fs.writeFileSync(indexPath, html, 'utf8');
          }
          if (!fs.readFileSync(indexPath, 'utf8').includes('ysda-hero-stats-mobile-fix')) throw new Error('Hero stats mobile fix missing');
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
