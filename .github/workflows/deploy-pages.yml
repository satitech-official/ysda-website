name: Deploy YSDA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES_BASE_PATH: "/"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore selected PDF football photos
        run: |
          mkdir -p public/ysda-football
          base64 --decode assets/ysda-pdf-football.zip.b64 > /tmp/ysda-pdf-football.zip
          unzip -q -o /tmp/ysda-pdf-football.zip -d public/ysda-football
          test -s public/ysda-football/pdf-football-01.jpg
          test -s public/ysda-football/pdf-football-02.jpg
          test -s public/ysda-football/pdf-football-03.jpg
          test -s public/ysda-football/pdf-football-04.jpg

      - name: Prepare YSDA football-only source with PDF photos
        run: |
          node <<'NODE'
          const fs = require('fs');

          const pagePath = 'app/page.tsx';
          let page = fs.readFileSync(pagePath, 'utf8');
          page = page.replace(/YSDFI/gi, 'YSDA');
          fs.writeFileSync(pagePath, page, 'utf8');

          const contentPath = 'lib/content.ts';
          let content = fs.readFileSync(contentPath, 'utf8');

          const oldPhotoHelper = `const footballPhoto = (number: 1 | 2) =>\n  \`/ysda-football/football-\${String(number).padStart(2, "0")}.jpg\`;`;
          const pdfPhotoHelper = `const footballPhotos = {\n  1: "/ysda-football/pdf-football-01.jpg",\n  2: "/ysda-football/pdf-football-02.jpg",\n  3: "/ysda-football/pdf-football-03.jpg",\n  4: "/ysda-football/pdf-football-04.jpg"\n} as const;\n\nconst footballPhoto = (number: keyof typeof footballPhotos) => footballPhotos[number];`;

          if (content.includes(oldPhotoHelper)) {
            content = content.replace(oldPhotoHelper, pdfPhotoHelper);
          } else if (/const footballPhotos = \{[\s\S]*?const footballPhoto =/.test(content)) {
            content = content.replace(/const footballPhotos = \{[\s\S]*?const footballPhoto = \(number:[\s\S]*?;\n/, `${pdfPhotoHelper}\n`);
          } else {
            throw new Error('Could not locate football photo helper');
          }

          const mediaBlock = `export const media = {\n  heroVideo: "/ysda-hero-football.mp4",\n  heroVideoFallback: "https://videos.pexels.com/video-files/31370183/13386254_3840_2160_24fps.mp4",\n  heroPoster: footballPhoto(1),\n  fallback: "/brand/ysda-logo-white.png",\n  heroAction: footballPhoto(2),\n  heroTeam: footballPhoto(1),\n  heroDevelopment: footballPhoto(4),\n  heroSquad: footballPhoto(1),\n  heroMatch: footballPhoto(3),\n  heroTraining: footballPhoto(4),\n  footballWarmup: footballPhoto(4),\n  footballTeam: footballPhoto(1),\n  footballCoach: footballPhoto(4),\n  fitness: footballPhoto(2),\n  teamTraining: footballPhoto(4),\n  trophy: footballPhoto(1),\n  leadership: footballPhoto(4),\n  secretaryPortrait: footballPhoto(1),\n  officials: footballPhoto(4),\n  certificates: footballPhoto(1),\n  awards: footballPhoto(1),\n  girlsTeam: footballPhoto(3),\n  referee: footballPhoto(4),\n  schoolProgram: footballPhoto(2),\n  trials: footballPhoto(2),\n  community: footballPhoto(3)\n};`;

          if (!/export const media = \{[\s\S]*?\n\};/.test(content)) throw new Error('Media block not found');
          content = content.replace(/export const media = \{[\s\S]*?\n\};/, mediaBlock);

          content = content.replace(
            /image: footballPhoto\(\(\(index % 2\) \+ 1\) as 1 \| 2\)/g,
            'image: footballPhoto(((index % 4) + 1) as 1 | 2 | 3 | 4)'
          );

          content = content.replace(
            'title, category, image, eventName, date: "2026", location: index % 2 === 0 ? "Mhow, Indore" : "YSDA Football Academy", caption\n}));',
            'title, category, image, eventName, date: "2026", location: index % 2 === 0 ? "Mhow, Indore" : "YSDA Football Academy", caption, video: undefined as string | undefined\n}));'
          );

          if (/YSDFI/i.test(content) || /YSDFI/i.test(page)) throw new Error('Legacy federation branding remains in source');
          if (/images\.pexels\.com/i.test(content)) throw new Error('External Pexels photo remains in content');
          if (/\/ysda-football\/football-0[12]\.jpg/.test(content)) throw new Error('Old local football photos still referenced');
          for (let i = 1; i <= 4; i++) {
            const ref = `/ysda-football/pdf-football-0${i}.jpg`;
            if (!content.includes(ref)) throw new Error(`Missing PDF football photo reference: ${ref}`);
          }
          fs.writeFileSync(contentPath, content, 'utf8');
          NODE

      - name: Build static website
        run: npm run build

      - name: Normalize custom-domain paths and validate PDF-football-only output
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const outDir = path.resolve('out');
          const legacyPrefix = '/ysda-website';
          const textExtensions = new Set(['.html', '.js', '.css', '.json', '.txt', '.map', '.xml', '.webmanifest']);

          function walk(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const fullPath = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(fullPath) : [fullPath];
            });
          }

          let changed = 0;
          for (const file of walk(outDir)) {
            if (!textExtensions.has(path.extname(file).toLowerCase())) continue;
            const original = fs.readFileSync(file, 'utf8');
            const updated = original.split(legacyPrefix).join('').replace(/YSDFI/gi, 'YSDA');
            if (updated !== original) {
              fs.writeFileSync(file, updated, 'utf8');
              changed += 1;
            }
          }

          const violations = [];
          let pdfPhotoRefs = 0;
          for (const file of walk(outDir)) {
            if (!textExtensions.has(path.extname(file).toLowerCase())) continue;
            const text = fs.readFileSync(file, 'utf8');
            if (text.includes(legacyPrefix)) violations.push(`${file}: legacy base path`);
            if (/YSDFI/i.test(text)) violations.push(`${file}: legacy federation branding`);
            if (/\b(basketball|volleyball|cricket|skating|karate|kho-kho)\b/i.test(text)) violations.push(`${file}: non-football sport content`);
            if (/images\.pexels\.com/i.test(text)) violations.push(`${file}: external Pexels photo reference`);
            if (/\/ysda-football\/football-0[12]\.jpg/.test(text)) violations.push(`${file}: old football photo reference`);
            if (/\/ysda-football\/pdf-football-0[1-4]\.jpg/.test(text)) pdfPhotoRefs += 1;
          }

          for (let i = 1; i <= 4; i++) {
            const imagePath = path.join(outDir, 'ysda-football', `pdf-football-0${i}.jpg`);
            if (!fs.existsSync(imagePath) || fs.statSync(imagePath).size < 10000) {
              violations.push(`${imagePath}: missing or invalid PDF football photo`);
            }
          }
          if (!pdfPhotoRefs) violations.push('No PDF football photo references found in generated output');
          if (violations.length) throw new Error(`PDF-football-only validation failed:\n${violations.join('\n')}`);
          console.log(`Validated PDF football photos successfully; normalized ${changed} generated file(s).`);
          NODE

      - name: Ensure hero stats render correctly on mobile
        run: |
          node <<'NODE'
          const fs = require('fs');
          const indexPath = require('path').resolve('out/index.html');
          let html = fs.readFileSync(indexPath, 'utf8');
          const script = `<script id="ysda-hero-stats-mobile-fix">(function(){var expected={"Players Connected":"5000+","Football Events":"50+","Clubs and Academies":"70+","Coaches and Officials":"150+"};function fix(){var hero=document.getElementById("home");if(!hero)return;hero.querySelectorAll(".glass").forEach(function(card){var p=card.querySelector("p");var span=card.querySelector("span");if(!p||!span)return;var value=expected[p.textContent.trim()];if(value)span.textContent=value;});}[0,250,750,1500,3000].forEach(function(ms){setTimeout(fix,ms)});document.addEventListener("visibilitychange",function(){if(!document.hidden)fix()});})();</script>`;
          if (!html.includes('ysda-hero-stats-mobile-fix')) {
            html = html.replace('</body>', `${script}</body>`);
            fs.writeFileSync(indexPath, html, 'utf8');
          }
          if (!fs.readFileSync(indexPath, 'utf8').includes('ysda-hero-stats-mobile-fix')) throw new Error('Hero stats mobile fix missing');
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
