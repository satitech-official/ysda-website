name: Deploy YSDA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES_BASE_PATH: "/"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create sharp football media directly in source
        run: |
          set -euo pipefail
          mkdir -p public/ysda-gallery public/ysda-football/replacements

          # Correct old YSDA football photos, copied byte-for-byte (no resize/recompression).
          cp public/ysdfi-gallery/ysdfi-113-gallery3-p49.jpg public/ysda-gallery/team-training.jpg
          cp public/ysdfi-gallery/ysdfi-132-gallery2-p15.jpg public/ysda-gallery/football-team.jpg
          cp public/ysdfi-gallery/ysdfi-089-gallery3-p25.jpg public/ysda-gallery/hero-squad.jpg
          cp public/ysdfi-gallery/ysdfi-088-gallery3-p24.jpg public/ysda-gallery/hero-team.jpg
          cp public/ysdfi-gallery/ysdfi-106-gallery3-p42.jpg public/ysda-gallery/fitness.jpg
          cp public/ysdfi-gallery/ysdfi-135-gallery2-p18.jpg public/ysda-gallery/hero-action.jpg
          cp public/ysdfi-gallery/ysdfi-136-gallery2-p19.jpg public/ysda-gallery/hero-match.jpg
          cp public/ysdfi-gallery/ysdfi-107-gallery3-p43.jpg public/ysda-gallery/football-coach.jpg
          cp public/ysdfi-gallery/ysdfi-141-gallery2-p24.jpg public/ysda-gallery/hero-development.jpg
          cp public/ysdfi-gallery/ysdfi-140-gallery2-p23.jpg public/ysda-gallery/hero-training.jpg

          # Only visually verified football photos from the supplied PDF extraction.
          cp public/ysdfi-gallery/ysdfi-008-gallery4-p08.jpg public/ysda-football/replacements/pdf-football-01.jpg
          cp public/ysdfi-gallery/ysdfi-009-gallery4-p09.jpg public/ysda-football/replacements/pdf-football-02.jpg
          cp public/ysdfi-gallery/ysdfi-138-gallery2-p21.jpg public/ysda-football/replacements/pdf-football-06.jpg
          cp public/ysdfi-gallery/ysdfi-139-gallery2-p22.jpg public/ysda-football/replacements/pdf-football-07.jpg

          # Explicitly remove the blurry / non-football replacement candidates.
          rm -f public/ysda-football/replacements/pdf-football-03.jpg
          rm -f public/ysda-football/replacements/pdf-football-04.jpg
          rm -f public/ysda-football/replacements/pdf-football-05.jpg

          test -s public/ysda-hero-football.mp4
          test -s public/ysda-football-team-award.png
          test -s public/ysda-president-rafik-raja.jpg
          test -s public/ysda-secretary-ramiz-raja.png
          for f in public/ysda-gallery/*.jpg public/ysda-football/replacements/*.jpg; do test -s "$f"; done

      - name: Write final image mapping into GitHub source
        run: |
          node <<'NODE'
          const fs = require('fs');
          const contentPath = 'lib/content.ts';
          const pagePath = 'app/page.tsx';
          let content = fs.readFileSync(contentPath, 'utf8');
          let page = fs.readFileSync(pagePath, 'utf8');

          // Remove the old 2-photo helper so the repository itself no longer repeats two images everywhere.
          content = content.replace(/const footballPhoto = [\s\S]*?;\n\n(?=export const media =)/, '');

          const mediaBlock = `export const media = {
  heroVideo: "/ysda-hero-football.mp4",
  heroVideoFallback: "https://videos.pexels.com/video-files/31370183/13386254_3840_2160_24fps.mp4",
  heroPoster: "/ysda-football-team-award.png",
  fallback: "/brand/ysda-logo-white.png",
  heroAction: "/ysda-gallery/team-training.jpg",
  heroTeam: "/ysda-gallery/football-team.jpg",
  heroDevelopment: "/ysda-gallery/hero-development.jpg",
  heroSquad: "/ysda-gallery/hero-squad.jpg",
  heroMatch: "/ysda-gallery/hero-match.jpg",
  heroTraining: "/ysda-gallery/hero-training.jpg",
  footballWarmup: "/ysda-football/replacements/pdf-football-01.jpg",
  footballTeam: "/ysda-gallery/football-team.jpg",
  footballCoach: "/ysda-gallery/football-coach.jpg",
  fitness: "/ysda-gallery/fitness.jpg",
  teamTraining: "/ysda-gallery/team-training.jpg",
  trophy: "/ysda-football-team-award.png",
  leadership: "/ysda-president-rafik-raja.jpg",
  secretaryPortrait: "/ysda-secretary-ramiz-raja.png",
  officials: "/ysda-football/replacements/pdf-football-02.jpg",
  certificates: "/ysda-gallery/hero-squad.jpg",
  awards: "/ysda-football-team-award.png",
  girlsTeam: "/ysda-football/replacements/pdf-football-02.jpg",
  referee: "/ysda-football/replacements/pdf-football-06.jpg",
  schoolProgram: "/ysda-football/replacements/pdf-football-07.jpg",
  trials: "/ysda-gallery/hero-development.jpg",
  community: "/ysda-gallery/team-training.jpg"
};`;

          if (!/export const media = \{[\s\S]*?\n\};/.test(content)) throw new Error('Media block not found');
          content = content.replace(/export const media = \{[\s\S]*?\n\};/, mediaBlock);

          // Keep existing gallery content/layout, only make its item shape type-safe.
          const galleryNeedle = 'title, category, image, eventName, date: "2026", location: index % 2 === 0 ? "Mhow, Indore" : "YSDA Football Academy", caption\n}));';
          const galleryFixed = 'title, category, image, eventName, date: "2026", location: index % 2 === 0 ? "Mhow, Indore" : "YSDA Football Academy", caption, video: undefined as string | undefined\n}));';
          if (content.includes(galleryNeedle)) content = content.replace(galleryNeedle, galleryFixed);

          // Branding cleanup in runtime source only; no design/layout edits.
          content = content.replace(/YSDFI/gi, 'YSDA');
          page = page.replace(/YSDFI/gi, 'YSDA');

          if (/footballPhoto\(/.test(content)) throw new Error('Old two-photo helper usage remains');
          if (/pdf-football-0[345]\.jpg/.test(content)) throw new Error('Blurred/non-football replacement remains referenced');
          if (/ysdfi/i.test(content) || /ysdfi/i.test(page)) throw new Error('YSDFI runtime source reference remains');
          if (!content.includes('footballWarmup: "/ysda-football/replacements/pdf-football-01.jpg"')) throw new Error('Sharp featured image mapping missing');
          if (!content.includes('leadership: "/ysda-president-rafik-raja.jpg"')) throw new Error('President photo changed');
          if (!content.includes('secretaryPortrait: "/ysda-secretary-ramiz-raja.png"')) throw new Error('Secretary photo changed');
          if (!content.includes('heroVideo: "/ysda-hero-football.mp4"')) throw new Error('Hero video changed');

          fs.writeFileSync(contentPath, content, 'utf8');
          fs.writeFileSync(pagePath, page, 'utf8');
          NODE

      - name: Commit real media changes to main source
        run: |
          set -euo pipefail
          git config user.name "SatiTech"
          git config user.email "www.satitechinfo@gmail.com"
          git add lib/content.ts app/page.tsx public/ysda-gallery public/ysda-football/replacements
          if ! git diff --cached --quiet; then
            git commit -m "Fix blurry and repeated YSDA football photos [skip ci]"
            git push origin HEAD:main
          fi

      - name: Build static website
        run: npm run build

      - name: Validate sharp football-only live output
        run: |
          set -euo pipefail
          rm -rf out/ysdfi-gallery

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const outDir = path.resolve('out');
          const legacyPrefix = '/ysda-website';
          const textExtensions = new Set(['.html','.js','.css','.json','.txt','.map','.xml','.webmanifest']);
          function walk(dir) {
            return fs.readdirSync(dir,{withFileTypes:true}).flatMap(e => {
              const p=path.join(dir,e.name); return e.isDirectory()?walk(p):[p];
            });
          }
          for (const file of walk(outDir)) {
            if (!textExtensions.has(path.extname(file).toLowerCase())) continue;
            const original=fs.readFileSync(file,'utf8');
            const updated=original.split(legacyPrefix).join('').replace(/YSDFI/gi,'YSDA');
            if(updated!==original) fs.writeFileSync(file,updated,'utf8');
          }
          const files=walk(outDir);
          const combined=files.filter(f=>textExtensions.has(path.extname(f).toLowerCase())).map(f=>fs.readFileSync(f,'utf8')).join('\n');
          const violations=[];
          if (/ysdfi/i.test(combined)) violations.push('YSDFI remains in live runtime');
          if (files.some(f=>/ysdfi/i.test(path.relative(outDir,f)))) violations.push('YSDFI-named file remains in live artifact');
          if (/\b(basketball|volleyball|cricket|skating|karate|kho-kho)\b/i.test(combined)) violations.push('non-football sport content remains');
          if (/pdf-football-0[345]\.jpg/.test(combined)) violations.push('blurred/non-football replacement remains');
          for (const ref of [
            '/ysda-hero-football.mp4','/ysda-football-team-award.png',
            '/ysda-president-rafik-raja.jpg','/ysda-secretary-ramiz-raja.png',
            '/ysda-football/replacements/pdf-football-01.jpg',
            '/ysda-gallery/football-team.jpg','/ysda-gallery/football-coach.jpg',
            '/ysda-gallery/hero-training.jpg','/ysda-gallery/team-training.jpg'
          ]) if(!combined.includes(ref)) violations.push(`missing runtime reference: ${ref}`);
          for (const rel of [
            'ysda-hero-football.mp4','ysda-football-team-award.png',
            'ysda-president-rafik-raja.jpg','ysda-secretary-ramiz-raja.png',
            'ysda-football/replacements/pdf-football-01.jpg',
            'ysda-football/replacements/pdf-football-02.jpg',
            'ysda-football/replacements/pdf-football-06.jpg',
            'ysda-football/replacements/pdf-football-07.jpg',
            'ysda-gallery/football-team.jpg','ysda-gallery/football-coach.jpg',
            'ysda-gallery/fitness.jpg','ysda-gallery/team-training.jpg'
          ]) {
            const p=path.join(outDir,rel);
            if(!fs.existsSync(p)||fs.statSync(p).size===0) violations.push(`missing asset: ${rel}`);
          }
          if(violations.length) throw new Error(violations.join('\n'));
          console.log('Sharp, distinct, football-only media validation passed.');
          NODE

      - name: Ensure hero stats render correctly on mobile
        run: |
          node <<'NODE'
          const fs=require('fs');
          const indexPath=require('path').resolve('out/index.html');
          let html=fs.readFileSync(indexPath,'utf8');
          const script=`<script id="ysda-hero-stats-mobile-fix">(function(){var expected={"Players Connected":"5000+","Football Events":"50+","Clubs and Academies":"70+","Coaches and Officials":"150+"};function fix(){var hero=document.getElementById("home");if(!hero)return;hero.querySelectorAll(".glass").forEach(function(card){var p=card.querySelector("p");var span=card.querySelector("span");if(!p||!span)return;var value=expected[p.textContent.trim()];if(value)span.textContent=value;});}[0,250,750,1500,3000].forEach(function(ms){setTimeout(fix,ms)});})();</script>`;
          if(!html.includes('ysda-hero-stats-mobile-fix')) html=html.replace('</body>',`${script}</body>`);
          fs.writeFileSync(indexPath,html,'utf8');
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
